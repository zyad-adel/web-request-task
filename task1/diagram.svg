<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <rect x="0" y="0" width="900" height="600" fill="#0d1117"/>
  <text x="450" y="45" text-anchor="middle" fill="#58a6ff" font-size="22" font-weight="bold">Web Request Lifecycle</text>
  
  <!-- Flow Container -->
  <g transform="translate(50, 80)">
    <!-- Hop 1 -->
    <rect x="50" y="20" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="45" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">1. User / Browser</text>
    <text x="160" y="65" text-anchor="middle" fill="#8b949e" font-size="11">Types URL &amp; Hits Enter</text>
    
    <path d="M 270 50 L 320 50" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Hop 2 -->
    <rect x="330" y="20" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="440" y="45" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">2. DNS Lookup</text>
    <text x="440" y="65" text-anchor="middle" fill="#8b949e" font-size="11">Resolves domain to IP</text>
    
    <path d="M 550 50 L 600 50" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hop 3 -->
    <rect x="610" y="20" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="720" y="45" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">3. Handshake</text>
    <text x="720" y="65" text-anchor="middle" fill="#8b949e" font-size="11">TCP &amp; TLS/SSL Encryption</text>
    
    <path d="M 720 80 L 720 150 L 720 160" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hop 4 -->
    <rect x="610" y="170" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="720" y="195" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">4. HTTP Request</text>
    <text x="720" y="215" text-anchor="middle" fill="#8b949e" font-size="11">Sends GET Method + Headers</text>

    <path d="M 610 200 L 560 200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hop 5 -->
    <rect x="330" y="170" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="440" y="195" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">5. Web Server</text>
    <text x="440" y="215" text-anchor="middle" fill="#8b949e" font-size="11">Processes &amp; Fetches Data</text>

    <path d="M 330 200 L 280 200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hop 6 -->
    <rect x="50" y="170" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="195" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="bold">6. HTTP Response</text>
    <text x="160" y="215" text-anchor="middle" fill="#8b949e" font-size="11">200 OK + HTML/CSS/JS</text>

    <path d="M 160 230 L 160 300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Hop 7 -->
    <rect x="50" y="310" width="780" height="60" rx="8" fill="#238636" stroke="#2ea043" stroke-width="2"/>
    <text x="440" y="335" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">7. Page Rendering</text>
    <text x="440" y="355" text-anchor="middle" fill="#e6edf3" font-size="12">Browser parses files and displays the web page to the user</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>
</svg>
